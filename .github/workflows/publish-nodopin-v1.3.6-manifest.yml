name: NodoPin v1.3.6 — publicar manifiesto tras validar APK

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: nodopin-version-manifest-main
  cancel-in-progress: false

jobs:
  publish-v136:
    if: ${{ github.event.release.tag_name == 'v1.3.6' && !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_HASH: "cb2cd459040b1b2db324e03e4317765db0241b0474086451eb97b8274f48283a"
    steps:
      - name: Obtener manifiesto actual de main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verificar un único archivo nodopin.apk en esta release
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.3.6" --jq '[.assets[] | select(.name == "nodopin.apk")] | length')"
          if [[ "$COUNT" != "1" ]]; then
            echo 'BLOQUEADO: falta nodopin.apk o hay archivos con ese nombre duplicados.' >&2
            exit 1
          fi
      - name: Descargar y verificar el SHA-256 de la APK firmada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nodopin-v136"
          gh release download v1.3.6 --repo "$GITHUB_REPOSITORY" --pattern 'nodopin.apk' --dir "$RUNNER_TEMP/nodopin-v136"
          printf '%s  %s\n' "$EXPECTED_HASH" "$RUNNER_TEMP/nodopin-v136/nodopin.apk" | sha256sum -c -
      - name: Actualizar exclusivamente el manifiesto de actualización
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('nodopin/version.json')
          doc=json.loads(p.read_text(encoding='utf-8'))
          previous=int(doc.get('versionCode',0))
          sha="cb2cd459040b1b2db324e03e4317765db0241b0474086451eb97b8274f48283a"
          if previous > 51:
              raise SystemExit('Una versión más reciente está publicada; no retroceder.')
          if previous == 51 and doc.get('sha256') != sha:
              raise SystemExit('Conflicto: versionCode 51 tiene un SHA distinto.')
          doc.update({
              'versionCode':51,
              'versionName':'1.3.6',
              'downloadUrl':'https://github.com/ariellourdes52-collab/nodopin-updates/releases/download/v1.3.6/nodopin.apk',
              'sha256':sha,
              'changelog':'Sirena sísmica exclusiva; notificaciones al chat correcto; copiar textos; enlaces pulsables y vistas previas privadas; mejoras de compatibilidad Android 17.'
          })
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Confirmar manifiesto verificado en main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- nodopin/version.json; then
            echo 'Manifest ya actualizado, sin cambios.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- nodopin/version.json
          git commit -m 'release(nodopin): public v1.3.6 (51) verified APK manifest'
          git push origin HEAD:main
          echo 'Versión 51 publicada en el manifiesto después de verificar el archivo.'
