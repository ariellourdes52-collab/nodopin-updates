name: NodoPin — preparar borrador v1.5.8 (76)

on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.5.8.md'
      - '.github/workflows/prepare-nodopin-v1.5.8-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nodopin-v1.5.8-draft
  cancel-in-progress: false

jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Crear solo el borrador v1.5.8
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.5.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v1.5.8 ya existe; no se publica ni se adjunta ningún APK."
            gh release view v1.5.8 --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,name --jq '{isDraft,tagName,name}'
            exit 0
          fi
          gh release create v1.5.8 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --draft \
            --title "🔐 NodoPin v1.5.8 (76) — Tor, privacidad y controles mejorados" \
            --notes-file releases/v1.5.8.md
          gh release view v1.5.8 --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,name --jq '{isDraft,tagName,name}'
          echo "Solo borrador: sin publicar, sin APK, sin modificar nodopin/version.json."
