name: NodoPin — activar v1.4.5 solo con APK verificada

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: nodopin-v1.4.5-manifest
  cancel-in-progress: false

jobs:
  update-version:
    if: ${{ github.event.release.tag_name == 'v1.4.5' && !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TAG: v1.4.5
      EXPECTED_SHA256: 6cca0e8f0f023bfc156e764442da06593e4cf32b54e1238947f73f4d8ee012fa
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Descargar la rama oficial
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Exigir un único nodopin.apk válido
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" --jq '[.assets[] | select(.name == "nodopin.apk" and .state == "uploaded")] | length')"
          if [[ "$COUNT" != "1" ]]; then
            echo "ERROR: nodopin.apk ausente o duplicado; NO activar actualizador" >&2
            exit 1
          fi
          TOTAL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" --jq '.assets | length')"
          if [[ "$TOTAL" != "1" ]]; then
            echo "ERROR: archivos no previstos adjuntos a la versión" >&2
            exit 1
          fi

      - name: Comprobar SHA-256 de los bytes publicados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nodopin-1.4.5"
          gh release download "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'nodopin.apk' --dir "$RUNNER_TEMP/nodopin-1.4.5"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/nodopin-1.4.5/nodopin.apk" | sha256sum -c -

      - name: Actualizar manifest y README sin permitir retrocesos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('nodopin/version.json')
          current=json.loads(p.read_text(encoding='utf-8'))
          code=int(current.get('versionCode',0))
          digest='6cca0e8f0f023bfc156e764442da06593e4cf32b54e1238947f73f4d8ee012fa'
          if code>61: raise SystemExit('Ya existe una versión superior. No retroceder.')
          if code==61 and current.get('sha256')!=digest:
              raise SystemExit('Otra APK ocupa versionCode 61. Revisión manual.')
          current.update({
            'versionCode':61,
            'versionName':'1.4.5',
            'downloadUrl':'https://github.com/ariellourdes52-collab/nodopin-updates/releases/download/v1.4.5/nodopin.apk',
            'sha256':digest,
            'changelog':'Corregido el problema que podía congelar la aplicación al eliminar grupos.'
          })
          updated=json.dumps(current,ensure_ascii=False,indent=2)+'\\n'
          if p.read_text(encoding='utf-8')!=updated:p.write_text(updated,encoding='utf-8')
          readme=Path('README.md')
          text=readme.read_text(encoding='utf-8')
          before='**v1.4.4 (60)** — SOS celular directo sin Internet ni enlaces locales, GPS con enlace a Google Maps y experiencia SOS más elegante.'
          after='**v1.4.5 (61)** — corrección del bloqueo que podía congelar la aplicación al eliminar grupos.'
          before_link='[Leer todas las novedades de v1.4.4](RELEASE_NOTES_v1.4.4.md)'
          after_link='[Leer todas las novedades de v1.4.5](RELEASE_NOTES_v1.4.5.md)'
          if after in text and after_link in text:
              print('README actualizado previamente.')
          elif before in text and before_link in text:
              readme.write_text(text.replace(before,after).replace(before_link,after_link),encoding='utf-8')
          else:
              raise SystemExit('README distinto del esperado; no cambiar a ciegas.')
          PY

      - name: Activar actualización solo tras verificar el APK publicado
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- nodopin/version.json README.md; then
            echo 'Actualizador ya apunta a la versión verificada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- nodopin/version.json README.md
          git commit -m 'release(nodopin): activar v1.4.5 (61) tras verificar APK'
          git pull --rebase origin main
          git push origin HEAD:main
