name: NodoPin — activar v1.3.10 solo después de publicar APK verificada

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: nodopin-version-manifest-main
  cancel-in-progress: false

jobs:
  update-version:
    if: ${{ github.event.release.tag_name == 'v1.3.10' && !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_TAG: 'v1.3.10'
      EXPECTED_SHA256: '0dc79ad62f14e1a587ebbd4db2cf40295ca0d6e6bac07651055334befcabe4c6'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Obtener la rama main oficial
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Confirmar que existe un único APK publicado
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" --jq '[.assets[] | select(.name == "nodopin.apk" and .state == "uploaded")] | length')"
          if [[ "$COUNT" != "1" ]]; then
            echo "ERROR: es obligatorio publicar exactamente un nodopin.apk." >&2
            exit 1
          fi

      - name: Descargar APK y verificar SHA-256 exacto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nodopin-v1.3.10"
          gh release download "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" --pattern "nodopin.apk" --dir "$RUNNER_TEMP/nodopin-v1.3.10"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/nodopin-v1.3.10/nodopin.apk" | sha256sum -c -
          echo "OK: coincide con el APK v1.3.10 firmado e inspeccionado."

      - name: Actualizar manifiesto sin permitir retroceso de versión
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('nodopin/version.json')
          current = json.loads(p.read_text(encoding='utf-8'))
          current_code = int(current.get('versionCode', 0))
          expected_hash = '0dc79ad62f14e1a587ebbd4db2cf40295ca0d6e6bac07651055334befcabe4c6'
          if current_code > 55:
              raise SystemExit('Ya hay una versión superior. Se impide retroceder.')
          if current_code == 55 and current.get('sha256') != expected_hash:
              raise SystemExit('La versión 55 ya apunta a otro APK. Revisión manual requerida.')
          current.update({
              'versionCode': 55,
              'versionName': '1.3.10',
              'downloadUrl': 'https://github.com/ariellourdes52-collab/nodopin-updates/releases/download/v1.3.10/nodopin.apk',
              'sha256': expected_hash,
              'changelog': 'El creador puede eliminar un grupo para todos mediante órdenes cifradas. Limpieza de multimedia identificada en Cloudflare D1 y caducidad de videos grupales en B2; reintento para integrantes desconectados. Se conservan los chats privados, la copia NPBK2 y los transportes Internet/Bluetooth/Wi-Fi Direct.'
          })
          p.write_text(json.dumps(current, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Actualizar portada del repositorio tras validar APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old_version = '**v1.3.9 (54)** — grupos premium, recuperación NPBK2, mejor continuidad de identidad E2EE y una primera experiencia más intuitiva.'
          new_version = '**v1.3.10 (55)** — cierre de grupos para todos con órdenes cifradas y limpieza de multimedia grupal identificada en Cloudflare D1/B2.'
          old_link = '[Leer todas las novedades de v1.3.9](RELEASE_NOTES_v1.3.9.md)'
          new_link = '[Leer todas las novedades de v1.3.10](RELEASE_NOTES_v1.3.10.md)'
          if new_version in s and new_link in s:
              print('README ya actualizado.')
          elif old_version in s and old_link in s:
              s = s.replace(old_version, new_version).replace(old_link, new_link)
              p.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('README cambió: no sobrescribir referencias de versión sin revisión.')
          PY

      - name: Publicar nodopin/version.json cuando el APK ya es accesible
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- nodopin/version.json README.md; then
            echo "El manifiesto ya coincide con el APK verificado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nodopin/version.json README.md
          git commit -m "release(nodopin): publicar manifiesto APK verificado v1.3.10 (55)"
          git push origin HEAD:main
