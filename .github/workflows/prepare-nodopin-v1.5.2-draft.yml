name: NodoPin — preparar borrador v1.5.2
on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.5.2.md'
      - '.github/workflows/prepare-nodopin-v1.5.2-draft.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Crear borrador sin APK ni modificar el actualizador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.5.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión v1.5.2 ya existe. No modificar."
            exit 0
          fi
          gh release create v1.5.2 --repo "$GITHUB_REPOSITORY" --target main --draft --title "🔔 NodoPin v1.5.2 (68) — FCM y seguridad" --notes-file releases/v1.5.2.md
          echo "Borrador v1.5.2 preparado. Adjuntar nodopin.apk, verificar y después publicar."
