name: NodoPin — preparar borrador v1.5.3
on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.5.3.md'
      - '.github/workflows/prepare-nodopin-v1.5.3-draft.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Crear borrador sin APK ni cambios en el actualizador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -s releases/v1.5.3.md
          if gh release view v1.5.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'La versión v1.5.3 ya existe; no modificar.'
            exit 0
          fi
          gh release create v1.5.3 --repo "$GITHUB_REPOSITORY" --target main --draft --title "🔐 NodoPin v1.5.3 (69) — Primer saludo BLE más seguro" --notes-file releases/v1.5.3.md
          echo 'BORRADOR v1.5.3 creado; falta adjuntar nodopin.apk y publicar manualmente.'
