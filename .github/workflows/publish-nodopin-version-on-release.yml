name: NodoPin — actualizar versión solo tras publicar APK verificada

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: nodopin-version-manifest-main
  cancel-in-progress: false

jobs:
  update-version:
    if: ${{ github.event.release.tag_name == 'v1.3.5' && !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA256: '83a74994812dba632425a42ce5f0e1d71c7686f8b26d50f3d7cb9681aa9be2ff'
      EXPECTED_TAG: 'v1.3.5'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Obtener manifest de la rama oficial
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Comprobar que existe un único asset llamado nodopin.apk
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" \
            --jq '[.assets[] | select(.name == "nodopin.apk")] | length')"
          if [[ "$COUNT" != '1' ]]; then
            echo 'ERROR: el asset oficial nodopin.apk no está publicado de forma única.' >&2
            exit 1
          fi
      - name: Descargar y comprobar SHA-256 exacto del APK firmado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nodopin-v1.3.5"
          gh release download "$EXPECTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'nodopin.apk' \
            --dir "$RUNNER_TEMP/nodopin-v1.3.5"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/nodopin-v1.3.5/nodopin.apk" | sha256sum -c -
          echo 'APK coincide exactamente con la compilación v1.3.5 (50) previamente verificada.'
      - name: Actualizar únicamente nodopin/version.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('nodopin/version.json')
          current = json.loads(p.read_text('utf-8'))
          code = int(current.get('versionCode', 0))
          target_hash = '83a74994812dba632425a42ce5f0e1d71c7686f8b26d50f3d7cb9681aa9be2ff'
          if code > 50:
              raise SystemExit('Versión más reciente ya publicada: no retroceder')
          if code == 50 and current.get('sha256') != target_hash:
              raise SystemExit('La versión 50 ya apunta a otro APK: revisión manual requerida')
          current.update({
              'versionCode': 50,
              'versionName': '1.3.5',
              'downloadUrl': 'https://github.com/ariellourdes52-collab/nodopin-updates/releases/download/v1.3.5/nodopin.apk',
              'sha256': target_hash,
              'changelog': 'Centro DR con Radar general, avisos sísmicos y DR Agenda; alertas FCM, accesos duplicados retirados de SOS y Ajustes y respuestas citadas ahora visibles sobre el editor del chat.'
          })
          p.write_text(json.dumps(current, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Publicar manifest verificado en main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- nodopin/version.json; then
            echo 'El manifest ya estaba actualizado; no se crea otro commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- nodopin/version.json
          git commit -m 'release(nodopin): public v1.3.5 (50) verified APK manifest'
          git push origin HEAD:main
          echo 'Manifest v1.3.5 actualizado después de publicar y verificar el APK.'
