name: NodoPIN — activar v1.4.2 solo tras verificar APK publicada

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: nodopin-version-manifest-main
  cancel-in-progress: false

jobs:
  update-version:
    if: ${{ github.event.release.tag_name == 'v1.4.2' && !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_TAG: 'v1.4.2'
      EXPECTED_SHA256: '6bb3a268d3e2ea48cfcaa9660e2d9ded3e2bf7bc4d75a3ab20d87909778061ef'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Obtener rama main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Exigir exactamente un APK adjunto y publicado
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" --jq '[.assets[] | select(.name == "nodopin.apk" and .state == "uploaded")] | length')"
          test "$COUNT" = "1" || { echo 'ERROR: falta nodopin.apk o hay duplicados' >&2; exit 1; }

      - name: Descargar APK oficial y verificar hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nodopin-v1.4.2"
          gh release download "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'nodopin.apk' --dir "$RUNNER_TEMP/nodopin-v1.4.2"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/nodopin-v1.4.2/nodopin.apk" | sha256sum -c -

      - name: Actualizar JSON sin retroceder ni sustituir APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('nodopin/version.json')
          current = json.loads(p.read_text(encoding='utf-8'))
          code = int(current.get('versionCode', 0))
          digest = '6bb3a268d3e2ea48cfcaa9660e2d9ded3e2bf7bc4d75a3ab20d87909778061ef'
          if code > 58:
              raise SystemExit('Ya hay una versión más reciente: no retroceder.')
          if code == 58 and current.get('sha256') != digest:
              raise SystemExit('El código 58 apunta a otro APK: requiere revisión.')
          current.update({
              'versionCode': 58,
              'versionName': '1.4.2',
              'downloadUrl': 'https://github.com/ariellourdes52-collab/nodopin-updates/releases/download/v1.4.2/nodopin.apk',
              'sha256': digest,
              'changelog': 'Política de privacidad premium integrada, mejoras en inicio de sesiones E2EE con y sin Google y primeros intercambios de preclaves por BLE y Wi-Fi Direct. Pulido de iconos de privacidad.'
          })
          p.write_text(json.dumps(current, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Actualizar README al confirmar publicación
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '**v1.4.1 (57)** — guías de la sección SOS expandibles, contraídas por defecto y con diseño premium. Se conservan intactas las tarjetas de los chats y el envío SOS.'
          new = '**v1.4.2 (58)** — política de privacidad premium y mejoras en las preclaves para conexiones online y locales. Pruebas de conectividad local entre dispositivos recomendadas.'
          old_link = '[Leer todas las novedades de v1.4.1](RELEASE_NOTES_v1.4.1.md)'
          new_link = '[Leer todas las novedades de v1.4.2](RELEASE_NOTES_v1.4.2.md)'
          if new in s and new_link in s:
              print('README ya actualizado.')
          elif old in s and old_link in s:
              p.write_text(s.replace(old, new).replace(old_link, new_link), encoding='utf-8')
          else:
              raise SystemExit('El README cambió; no sustituir contenido a ciegas.')
          PY

      - name: Publicar JSON y README después de validar APK
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- nodopin/version.json README.md; then
            echo 'Manifest ya actualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- nodopin/version.json README.md
          git commit -m 'release(nodopin): activar v1.4.2 (58) con APK verificada'
          git push origin HEAD:main
