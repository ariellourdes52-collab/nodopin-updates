name: NodoPin — preparar borrador v1.5.7 (73)

on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.5.7.md'
      - '.github/workflows/prepare-nodopin-v1.5.7-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nodopin-v1.5.7-draft
  cancel-in-progress: false

jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Crear borrador v1.5.7, sin publicar ni tocar el actualizador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.5.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v1.5.7 ya existe: no se altera, publica ni adjuntan APK."
            gh release view v1.5.7 --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,name \
              --jq '{isDraft,tagName,name}'
            exit 0
          fi
          gh release create v1.5.7 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --draft \
            --title "🔐 NodoPin v1.5.7 (73) — Cifrado 600K, copias Android ↔ Web y todas las funciones de v1.5.6" \
            --notes-file releases/v1.5.7.md
          gh release view v1.5.7 --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,name \
            --jq '{isDraft,tagName,name}'
          echo "Borrador generado. No se adjunta APK, no se publica ni se modifica nodopin/version.json."
