name: NodoPin — preparar borrador GitHub v1.4.8

on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.4.8.md'
      - '.github/workflows/prepare-nodopin-v1.4.8-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Crear borrador de NodoPin v1.4.8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'La release v1.4.8 ya existe. No se modifica.'
            exit 0
          fi
          gh release create v1.4.8 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --draft \
            --title '✨ NodoPin v1.4.8 (64) — Actualizador Premium' \
            --notes-file releases/v1.4.8.md
          echo 'Borrador creado. Falta compilar, firmar y validar nodopin.apk antes de publicar.'
