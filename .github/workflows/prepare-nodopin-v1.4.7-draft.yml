name: NodoPin — preparar borrador GitHub v1.4.7

on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.4.7.md'
      - '.github/workflows/prepare-nodopin-v1.4.7-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Crear borrador sin publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'La release v1.4.7 ya existe. Se conserva sin cambios.'
            exit 0
          fi
          gh release create v1.4.7 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --draft \
            --title '🚀 NodoPin v1.4.7 (63) — Copia Integral desde el inicio' \
            --notes-file releases/v1.4.7.md
          echo 'Borrador preparado: adjuntar exclusivamente nodopin.apk y publicar.'
