name: NodoPin — preparar borrador v1.3.6

on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.3.6.md'
      - '.github/workflows/prepare-nodopin-v1.3.6-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Preparar versión sin publicarla antes de adjuntar la APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.3.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'La release v1.3.6 ya existe; no se sobrescribe.'
            exit 0
          fi
          gh release create v1.3.6 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --draft \
            --title 'NodoPin v1.3.6 (51) — Sirena sísmica y mejores conversaciones' \
            --notes-file releases/v1.3.6.md
          echo 'Borrador v1.3.6 creado; adjunta nodopin.apk y publica.'
